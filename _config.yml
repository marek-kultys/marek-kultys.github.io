# Jekyll REPLACES its default exclude list with whatever is set here — it does not
# merge the two. The defaults are Gemfile, Gemfile.lock, node_modules and the
# vendor/ subdirectories. Omitting them published Gemfile and Gemfile.lock to the
# live site (both were reachable at marekkultys.com/Gemfile.lock, a public list of
# every gem version this site is built from), and it also meant a local
# `bundle install --path vendor/bundle` would break the build by feeding the gems
# themselves to Jekyll as site content. Keep the defaults listed below; add to
# them, never replace them.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - CLAUDE.md
host: 0.0.0.0
url: "https://marekkultys.com"

destination: ./_site

permalink: /blog/:year/:month/:day/:title/
timezone: Europe/London


# FREE TO CHANGE
github: [metadata]
encoding: UTF-8
kramdown:
  input: GFM
  hard_wrap: false
future: true
jailed: false
gfm_quirks: paragraph_end


# CANNOT CHANGE
lsi: false
safe: true
source: .
incremental: false
highlighter: rouge
gist:
  noscript: false
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

